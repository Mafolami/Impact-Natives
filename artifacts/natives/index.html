<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta name="description" content="Natives is the coordination platform for Africa's social impact ecosystem. Connect with verified NGOs, funders, corporates, and ecosystem builders." />

    <style>
      html { background: #ffffff; }
      html.dark { background: hsl(193, 20%, 7%); }
      html { background: #ffffff; }
      #root { min-height: 100vh; }
    </style>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("next-themes");
          if (stored === "dark") {
            document.documentElement.classList.add("dark");
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("dark");
          }
        } catch(e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <div id="root"></div>
